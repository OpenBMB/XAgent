# ====================================================================
# THIS IS THE CORRECTED AND SIMPLIFIED CONFIG FILE
# ====================================================================

api_keys:
  # We will only define the gpt-4 model, which your key should have access to.
  gpt-4:
    # PASTE YOUR FULL, VALID OPENAI API KEY IN THE LINE BELOW
    - api_key: "sk-proj-8Hs"
      model: "gpt-4"

# Set the default request type to openai
default_request_type: openai

# Set the default model to gpt-4, which we know you have access to.
# THIS IS THE MOST IMPORTANT FIX.
default_completion_kwargs:
  model: "gpt-4"
  temperature: 0.2
  request_timeout: 60

# --- The rest of the settings are correct and can be left as is ---

enable_summary: true
summary:
  single_action_max_length: 2048
  max_return_length: 12384

use_selfhost_toolserver: true
selfhost_toolserver_url: http://localhost:8080

max_retry_times: 5
max_subtask_chain_length: 15
max_plan_refine_chain_length: 3
max_plan_tree_depth: 3
max_plan_tree_width: 5
max_plan_length: 8192

rapidapi_retrieve_tool_count: 0

enable_ask_human_for_help: False

tool_blacklist:
  - FileSystemEnv_print_filesys_struture

record_dir:

experiment:
  redo_action: false